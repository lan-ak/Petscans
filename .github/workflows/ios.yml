name: iOS CI

on:
  push:
    branches: ["**"]
    # `tools/matchkit/**` is here because it compiles the app's own matching and
    # scoring sources via symlink — a change there can only be validated by
    # running its tests. The data files matter for the same reason: they are
    # hand-maintained, have no schema, and `matchkit`'s data-validation tests are
    # the only thing that catches a dangling synonym or rule before it ships.
    paths:
      - "PetScans/**"
      - "PetScans.xcodeproj/**"
      - "tools/matchkit/**"
      - "tools/validate-ingredient-content.py"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "PetScans/**"
      - "PetScans.xcodeproj/**"
      - "tools/matchkit/**"
      - "tools/validate-ingredient-content.py"
      - ".github/workflows/ios.yml"

jobs:
  core:
    name: Matching, scoring & data tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Guards the one failure mode matchkit's design creates: a file added to the
      # app's matching core but never symlinked into Sources/matchkit/Shared. The
      # tool would still compile and still print confident numbers, computed by a
      # matcher missing a rule. Also fails if anything in the core imports a UI
      # framework, which is what would force a reimplementation instead.
      - name: Check shared-source symlinks
        working-directory: tools/matchkit
        run: swift run matchkit doctor

      # Covers persistence decoding (saved scans must survive schema changes),
      # matcher determinism and the specific wrong matches that reached production,
      # scoring invariants, and integrity of the four hand-maintained data files.
      - name: Test
        working-directory: tools/matchkit
        run: swift test

      # ingredient-content.json is model-authored and ships without human review.
      # This script is that review: it enforces that an entry may only restate what
      # the ingredient's own record already asserts — no invented numbers, no
      # medical claims, no safety verdict that contradicts the record's riskLevel.
      - name: Validate ingredient content
        run: python3 tools/validate-ingredient-content.py --coverage

  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # The real APIKeys.swift is gitignored (it holds the Superwall publishable
      # key). Generate a stub so the project compiles in CI. All provider keys
      # now live in the backend proxy, so only `superwall` is referenced.
      - name: Generate APIKeys stub
        run: |
          cat > PetScans/Services/APIKeys.swift <<'SWIFT'
          // Auto-generated for CI builds; the real file is gitignored.
          enum APIKeys {
              static let superwall = "ci-placeholder"
          }
          SWIFT

      # The app target's base configuration is Secrets.xcconfig (gitignored; holds
      # the Meta App ID/client token + Worker URL). Stub it from the committed
      # template so the build resolves the base config. Empty values keep the Meta
      # SDK inert and the API client on its fallback URL — the correct CI behaviour.
      - name: Generate Secrets.xcconfig stub
        run: cp PetScans/Config/Secrets.example.xcconfig PetScans/Config/Secrets.xcconfig

      # Pick any available iPhone simulator so we don't depend on a specific
      # device name across Xcode versions.
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[dev for rt,devs in d.items() if 'iOS' in rt for dev in devs if dev.get('isAvailable') and dev['name'].startswith('iPhone')]; print(c[0]['udid'] if c else '')")
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          # arm64-only (ONLY_ACTIVE_ARCH=YES) plus serialized compile jobs keep the
          # heavy SuperwallKit dependency from exhausting the runner's memory and
          # getting the compiler killed before our code is reached.
          xcodebuild build \
            -project PetScans.xcodeproj \
            -scheme PetScans \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -jobs 1 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
