<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Carousel 4</title>
<link rel="stylesheet" href="../../styles/creative.css">
<link rel="stylesheet" href="../../styles/carousel.css">
<script src="../../styles/common.js"></script>
<style>.stack{display:flex;flex-direction:column;gap:26px;width:100%}</style>
</head>
<body>
<div class="creative">
  <div class="chead">
    <div class="brand sm"><img src="../../assets/icon.png" alt=""><span class="name">PetScans</span></div>
    <span class="stepchip">Step 3</span>
  </div>
  <div class="cmid">
    <div class="ctitle">Instant allergen &amp;<br><span class="grad">toxic-ingredient</span> alerts</div>
    <div class="stack">
      <div class="card alert">
        <span class="badge">HIGH</span>
        <div class="txt"><div class="t">Contains chicken</div><div class="d">Conflicts with your pet's allergen profile.</div></div>
      </div>
      <div class="card alert warn">
        <span class="badge">CAUTION</span>
        <div class="txt"><div class="t">Artificial preservatives</div><div class="d">BHA / BHT flagged in this product.</div></div>
      </div>
    </div>
    <div class="csub">Set your pet's allergies once — we flag every ingredient they should avoid.</div>
  </div>
  <div class="cfoot">
    <div class="dots"><i></i><i></i><i></i><i class="on"></i><i></i></div>
    <span class="swipe">Swipe →</span>
  </div>
</div>
</body>
</html>
