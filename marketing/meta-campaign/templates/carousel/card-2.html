<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Carousel 2</title>
<link rel="stylesheet" href="../../styles/creative.css">
<link rel="stylesheet" href="../../styles/carousel.css">
<script src="../../styles/common.js"></script>
<style>.scan .label{position:absolute;bottom:44px;left:50%;transform:translateX(-50%)}</style>
</head>
<body>
<div class="creative">
  <div class="chead">
    <div class="brand sm"><img src="../../assets/icon.png" alt=""><span class="name">PetScans</span></div>
    <span class="stepchip">Step 1</span>
  </div>
  <div class="cmid">
    <div class="ctitle">Scan any label<br>or <span class="grad">barcode</span></div>
    <div style="width:100%">
      <div class="scan">
        <span class="bracket bl-tl"></span><span class="bracket bl-tr"></span>
        <span class="bracket bl-bl"></span><span class="bracket bl-br"></span>
        <span class="line"></span>
        <span class="label">Point &amp; scan — no typing</span>
      </div>
    </div>
    <div class="csub">Use your camera on any pet food or treat. Even proprietary blends get identified.</div>
  </div>
  <div class="cfoot">
    <div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i></div>
    <span class="swipe">Swipe →</span>
  </div>
</div>
</body>
</html>
