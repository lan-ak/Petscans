<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Carousel 3</title>
<link rel="stylesheet" href="../../styles/creative.css">
<link rel="stylesheet" href="../../styles/carousel.css">
<script src="../../styles/common.js"></script>
</head>
<body>
<div class="creative">
  <div class="chead">
    <div class="brand sm"><img src="../../assets/icon.png" alt=""><span class="name">PetScans</span></div>
    <span class="stepchip">Step 2</span>
  </div>
  <div class="cmid">
    <div class="ctitle">Get an instant<br>0–100 <span class="grad">safety score</span></div>
    <div class="score-row">
      <div class="score-tag"><div class="score excellent sm"><div class="n">85</div><div class="l">GREAT</div></div><span class="cap">Excellent</span></div>
      <div class="score-tag"><div class="score good sm"><div class="n">62</div><div class="l">OK</div></div><span class="cap">Good</span></div>
      <div class="score-tag"><div class="score moderate sm"><div class="n">38</div><div class="l">CARE</div></div><span class="cap">Moderate</span></div>
      <div class="score-tag"><div class="score poor sm"><div class="n">15</div><div class="l">AVOID</div></div><span class="cap">Poor</span></div>
    </div>
    <div class="csub">A clear, color-coded rating you can read at a glance — no jargon.</div>
  </div>
  <div class="cfoot">
    <div class="dots"><i></i><i></i><i class="on"></i><i></i><i></i></div>
    <span class="swipe">Swipe →</span>
  </div>
</div>
</body>
</html>
