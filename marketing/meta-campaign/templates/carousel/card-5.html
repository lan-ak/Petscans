<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Carousel 5</title>
<link rel="stylesheet" href="../../styles/creative.css">
<link rel="stylesheet" href="../../styles/carousel.css">
<script src="../../styles/common.js"></script>
</head>
<body>
<div class="creative" data-paws>
  <div class="chead">
    <div class="brand sm"><img src="../../assets/icon.png" alt=""><span class="name">PetScans</span></div>
    <span class="stepchip ghost">Get started</span>
  </div>
  <div class="cmid">
    <div class="ctitle">Backed by vet science.<br><span class="grad">Download free.</span></div>
    <div class="trust">
      <div class="b"><div class="k">AAFCO</div><div class="v">Standards</div></div>
      <div class="b"><div class="k">FDA</div><div class="v">Food safety</div></div>
      <div class="b"><div class="k">ASPCA</div><div class="v">Poison control</div></div>
      <div class="b"><div class="k">Merck</div><div class="v">Vet manual</div></div>
    </div>
    <div class="cta" style="justify-content:center">
      <span id="cta"></span>
      <span class="free">Free to download</span>
    </div>
  </div>
  <div class="cfoot">
    <div class="dots"><i></i><i></i><i></i><i></i><i class="on"></i></div>
    <span class="tagline">Every ingredient revealed.</span>
  </div>
</div>
<script>document.getElementById('cta').innerHTML = window.appStore();</script>
</body>
</html>
